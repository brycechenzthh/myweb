<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全部文章 · cxkk 技术小站</title>
<meta name="description" content="cxkk 技术小站全部文章">
<style>
  :root{
    --bg:#eef4fb;--card:#fff;--primary:#2f6fed;--primary-soft:#e4edfd;
    --text:#1f2d3d;--text-2:#5a6b7f;--text-3:#8a9ab0;--border:#e3ebf6;
    --radius:12px;--shadow:0 2px 10px rgba(47,111,237,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  a{color:inherit;text-decoration:none}
  header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .nav-inner{max-width:1180px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:28px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;color:var(--primary)}
  .logo-badge{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2f6fed,#5aa0ff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;overflow:hidden}
  .logo-badge img{width:100%;height:100%;object-fit:cover}
  .nav-menu{display:flex;gap:22px;font-size:15px;color:var(--text-2)}
  .nav-menu a:hover{color:var(--primary)}
  .nav-menu a.active{color:var(--primary);font-weight:600}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .nav-link{font-size:14.5px;color:var(--text-2);cursor:pointer;background:#fff;padding:7px 16px;border:1px solid var(--border);border-radius:8px;transition:.15s}
  .nav-link:hover,.nav-link.active{color:var(--primary);border-color:var(--primary)}
  .nav-btn{background:var(--primary);color:#fff;border:none;padding:7px 16px;border-radius:8px;font-size:14px;cursor:pointer}
  .nav-btn:hover{opacity:.9}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 40px}
  .page-head h1{font-size:24px;margin-bottom:6px}
  .page-head .sub{font-size:13px;color:var(--text-3);margin-bottom:16px}
  .cats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 22px}
  .cat{padding:7px 16px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:14px;color:var(--text-2);cursor:pointer;transition:.15s}
  .cat.active,.cat:hover{background:var(--primary);border-color:var(--primary);color:#fff}
  .card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .article-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);transition:.18s;cursor:pointer}
  .article-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(47,111,237,.12)}
  .article-card h4{font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.4}
  .article-card h4:hover{color:var(--primary)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
  .tag{font-size:12px;color:var(--primary);background:var(--primary-soft);padding:2px 9px;border-radius:5px}
  .cat-tag{font-size:11.5px;color:#fff;background:var(--primary);padding:2px 9px;border-radius:5px;margin-right:4px}
  .desc{font-size:13px;color:var(--text-2);margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;gap:14px;font-size:12px;color:var(--text-3)}
  .meta span{display:flex;align-items:center;gap:4px}
  .empty{grid-column:1/-1;text-align:center;color:var(--text-3);padding:60px 0}
  .admin-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .btn-add{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:14px;cursor:pointer;font-weight:600}
  .btn-add:hover{opacity:.9}
  .card-actions{display:flex;gap:6px;margin-top:10px}
  .btn-sm{font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--text-2)}
  .btn-sm:hover{border-color:var(--primary);color:var(--primary)}
  .btn-sm.del:hover{border-color:var(--danger);color:var(--danger)}
  .modal-mask{position:fixed;inset:0;background:rgba(15,30,55,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-box{background:#fff;border-radius:14px;width:min(520px,100%);max-height:90vh;overflow-y:auto;padding:24px}
  .modal-box h3{font-size:17px;margin-bottom:16px}
  .modal-box .field{margin-bottom:12px}
  .modal-box label{display:block;font-size:13px;color:var(--text-2);margin-bottom:5px}
  .modal-box input,.modal-box select,.modal-box textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;background:#fbfcfe}
  .modal-box input:focus,.modal-box select:focus,.modal-box textarea:focus{outline:none;border-color:var(--primary);background:#fff}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .modal-actions button{padding:9px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-weight:600}
  .btn-cancel{background:#eef1f6;color:var(--text-2)}
  .btn-save{background:var(--primary);color:#fff}
  .login-mask{position:fixed;inset:0;background:rgba(15,30,55,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:#fff;border-radius:14px;width:min(380px,100%);padding:28px 26px}
  .login-box h2{font-size:18px;margin-bottom:6px}
  .login-box .sub{font-size:12.5px;color:var(--text-3);margin-bottom:18px}
  .login-box input{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px 14px;font-size:14px;background:#fbfcfe;margin-bottom:12px}
  .login-box input:focus{outline:none;border-color:var(--primary);background:#fff}
  .login-err{color:var(--danger);font-size:12.5px;margin-bottom:10px;min-height:18px}
  .login-btn{width:100%;border:none;border-radius:8px;padding:11px;font-size:14.5px;background:var(--primary);color:#fff;cursor:pointer;font-weight:600}
  footer{border-top:1px solid var(--border);background:var(--card);padding:26px 20px;text-align:center;color:var(--text-3);font-size:13px}
  footer .brand{color:var(--text-2);font-weight:600}
  @media (max-width:900px){.nav-menu{display:none}}
  @media (max-width:560px){.card-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="nav-inner">
    <a class="logo" href="/">
      <span class="logo-badge" id="logoBadge">cx</span>
      <span id="siteName">cxkk</span>
    </a>
    <nav class="nav-menu">
      <a href="/">首页</a>
      <a href="/articles.html" class="active">全部文章</a>
      <a href="/apps.html">软件</a>
      <a href="/tutorials.html">教程</a>
      <a href="/about.html">关于</a>
    </nav>
    <div class="nav-right">
      <a class="nav-link" href="/links.html">链接</a>
      <a class="nav-btn" href="/about.html#login">登录</a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="page-head">
    <h1>全部文章</h1>
    <div class="sub">技术分享 · 软件工具 · 装机教程 · 硬件知识</div>
  </div>
  <div class="admin-bar">
    <div></div>
    <button class="btn-add" id="btnAdd" style="display:none" onclick="openArticle()">+ 添加文章</button>
  </div>
  <div class="cats" id="cats">
    <button class="cat active" data-cat="">全部</button>
    <button class="cat" data-cat="软件">软件</button>
    <button class="cat" data-cat="教程">教程</button>
    <button class="cat" data-cat="PE制作">PE 制作</button>
    <button class="cat" data-cat="硬件">硬件</button>
  </div>
  <div class="card-grid" id="list"></div>
</div>

<footer>
  <p id="footerText">© 2023-2026 By cxkk · 保持热爱，折腾不止</p>
</footer>

<!-- 文章编辑弹窗 -->
<div class="modal-mask" id="articleModal" style="display:none">
  <div class="modal-box">
    <h3 id="modalTitle">添加文章</h3>
    <div class="field"><label>标题</label><input id="fTitle" maxlength="80"></div>
    <div class="field"><label>分类</label>
      <select id="fCat">
        <option value="软件">软件</option>
        <option value="教程">教程</option>
        <option value="PE制作">PE 制作</option>
        <option value="硬件">硬件</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="field"><label>标签（逗号分隔）</label><input id="fTags" placeholder="如：NVIDIA, AMD"></div>
    <div class="field"><label>简介</label><textarea id="fDesc" rows="2" maxlength="300"></textarea></div>
    <div class="field"><label>外链（点击文章跳转，留空则跳分类页）</label><input id="fUrl" placeholder="https://..."></div>
    <div class="field" style="display:flex;gap:10px">
      <div style="flex:1"><label>日期</label><input id="fDate" placeholder="26/8/18"></div>
      <div style="flex:1"><label>阅读数</label><input id="fViews" placeholder="173,196"></div>
      <div style="flex:1"><label>评论数</label><input id="fComments" placeholder="235"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeArticle()">取消</button>
      <button class="btn-save" onclick="saveArticle()">保存</button>
    </div>
  </div>
</div>

<!-- 登录遮罩 -->
<div class="login-mask" id="loginMask" style="display:none">
  <div class="login-box">
    <h2>管理登录</h2>
    <div class="sub">登录后可添加、编辑、删除文章</div>
    <input type="password" id="loginPwd" placeholder="请输入管理密码" autocomplete="current-password">
    <div class="login-err" id="loginErr"></div>
    <button class="login-btn" onclick="doLogin()">登 录</button>
  </div>
</div>

<script>
  let ARTICLES = [];
  let curCat = '';
  let AUTHED = false;
  let TOKEN = localStorage.getItem('cxkk_token') || '';
  let editIdx = -1;

  function applyConfig(cfg){
    if (!cfg) return;
    if (cfg.name) document.getElementById('siteName').textContent = cfg.name;
    if (cfg.footer_text) document.getElementById('footerText').textContent = cfg.footer_text;
    document.title = document.title.replace('cxkk', cfg.name || 'cxkk');
    const badge = document.getElementById('logoBadge');
    if (cfg.logo_url) {
      badge.innerHTML = '<img src="' + cfg.logo_url + '" alt="logo">';
    } else {
      badge.innerHTML = '';
      badge.textContent = (cfg.logo_text || cfg.name || 'cx').slice(0, 2);
    }
  }

  function render(){
    const box = document.getElementById('list');
    box.innerHTML = '';
    const list = curCat ? ARTICLES.filter(a => a.cat === curCat) : ARTICLES;
    if (!list.length) {
      box.innerHTML = '<div class="empty">暂无文章</div>';
      return;
    }
    list.forEach(a => {
      const realIdx = ARTICLES.indexOf(a);
      const card = document.createElement('div');
      card.className = 'article-card';
      card.onclick = () => {
        if (a.url) { window.open(a.url, '_blank'); }
        else { location.href = '/article.html?idx=' + realIdx; }
      };
      const h = document.createElement('h4'); h.textContent = a.title;
      const tags = document.createElement('div'); tags.className = 'tags';
      const c = document.createElement('span'); c.className = 'cat-tag'; c.textContent = a.cat || '未分类';
      tags.appendChild(c);
      (a.tags || []).forEach(t => { const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; tags.appendChild(s); });
      const meta = document.createElement('div'); meta.className = 'meta';
      const d = document.createElement('span'); d.textContent = (a.date || '') + ' 更新';
      const c2 = document.createElement('span'); c2.textContent = (a.comments || '0') + ' 评论';
      const v = document.createElement('span'); v.textContent = (a.views || '0') + ' 阅读';
      meta.appendChild(d); meta.appendChild(c2); meta.appendChild(v);
      card.appendChild(h);
      if (a.desc) { const p = document.createElement('div'); p.className = 'desc'; p.textContent = a.desc; card.appendChild(p); }
      card.appendChild(tags); card.appendChild(meta);
      if (AUTHED) {
        const acts = document.createElement('div'); acts.className = 'card-actions';
        acts.onclick = e => e.stopPropagation();
        const ed = document.createElement('button'); ed.className = 'btn-sm'; ed.textContent = '编辑';
        ed.onclick = () => openArticle(realIdx);
        const dl = document.createElement('button'); dl.className = 'btn-sm del'; dl.textContent = '删除';
        dl.onclick = () => deleteArticle(realIdx);
        acts.appendChild(ed); acts.appendChild(dl);
        card.appendChild(acts);
      }
      box.appendChild(card);
    });
  }

  function openArticle(idx){
    editIdx = (typeof idx === 'number') ? idx : -1;
    document.getElementById('modalTitle').textContent = editIdx >= 0 ? '编辑文章' : '添加文章';
    const a = editIdx >= 0 ? ARTICLES[editIdx] : {};
    document.getElementById('fTitle').value = a.title || '';
    document.getElementById('fCat').value = a.cat || '软件';
    document.getElementById('fTags').value = (a.tags || []).join(', ');
    document.getElementById('fDesc').value = a.desc || '';
    document.getElementById('fUrl').value = a.url || '';
    document.getElementById('fDate').value = a.date || '';
    document.getElementById('fViews').value = a.views || '';
    document.getElementById('fComments').value = a.comments || '';
    document.getElementById('articleModal').style.display = 'flex';
  }
  function closeArticle(){ document.getElementById('articleModal').style.display = 'none'; }

  async function saveArticle(){
    const title = document.getElementById('fTitle').value.trim();
    if (!title) { alert('请填写标题'); return; }
    const obj = {
      title: title,
      cat: document.getElementById('fCat').value,
      tags: document.getElementById('fTags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
      desc: document.getElementById('fDesc').value.trim(),
      url: document.getElementById('fUrl').value.trim(),
      date: document.getElementById('fDate').value.trim(),
      views: document.getElementById('fViews').value.trim(),
      comments: document.getElementById('fComments').value.trim()
    };
    const next = ARTICLES.slice();
    if (editIdx >= 0) next[editIdx] = obj; else next.unshift(obj);
    const ok = await pushArticles(next);
    if (ok) { ARTICLES = next; closeArticle(); render(); }
  }

  async function deleteArticle(idx){
    if (!confirm('确定删除这篇文章？')) return;
    const next = ARTICLES.slice(); next.splice(idx, 1);
    const ok = await pushArticles(next);
    if (ok) { ARTICLES = next; render(); }
  }

  async function pushArticles(arr){
    try {
      const r = await fetch('/api/articles', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
        body: JSON.stringify(arr)
      });
      if (r.status === 401) {
        localStorage.removeItem('cxkk_token'); TOKEN = ''; AUTHED = false;
        document.getElementById('btnAdd').style.display = 'none';
        showLogin(); document.getElementById('loginErr').textContent = '登录已过期，请重新登录';
        return false;
      }
      const d = await r.json();
      if (!d.ok) { alert('保存失败'); return false; }
      return true;
    } catch(e) { alert('网络错误'); return false; }
  }

  async function checkAuth(){
    if (!TOKEN) return false;
    try {
      const r = await fetch('/api/check', { headers: { 'Authorization': 'Bearer ' + TOKEN }, cache: 'no-store' });
      const d = await r.json();
      return !!d.ok;
    } catch(e) { return false; }
  }

  function showLogin(){
    const mask = document.getElementById('loginMask');
    mask.style.display = 'flex';
    document.getElementById('loginPwd').focus();
    mask.onclick = e => { if (e.target === mask) mask.style.display = 'none'; };
  }

  async function doLogin(){
    const pwd = document.getElementById('loginPwd').value;
    const err = document.getElementById('loginErr');
    err.textContent = '';
    if (!pwd) { err.textContent = '请输入密码'; return; }
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
      const d = await r.json();
      if (d.ok && d.token) {
        TOKEN = d.token; localStorage.setItem('cxkk_token', TOKEN);
        AUTHED = true;
        document.getElementById('loginMask').style.display = 'none';
        document.getElementById('loginPwd').value = '';
        document.getElementById('btnAdd').style.display = 'inline-block';
        render();
      } else { err.textContent = '密码错误'; }
    } catch(e) { err.textContent = '网络错误'; }
  }

  async function init(){
    try {
      const res = await fetch('/api/site', { cache: 'no-store' });
      const data = await res.json();
      if (data.config) applyConfig(data.config);
      ARTICLES = Array.isArray(data.articles) ? data.articles : [];
    } catch(e) { ARTICLES = []; }
    const q = new URLSearchParams(location.search).get('cat');
    if (q) {
      curCat = q;
      document.querySelectorAll('.cat').forEach(b => b.classList.toggle('active', b.dataset.cat === q));
    }
    document.querySelectorAll('.cat').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.cat').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        curCat = btn.dataset.cat;
        render();
      };
    });
    AUTHED = await checkAuth();
    if (AUTHED) document.getElementById('btnAdd').style.display = 'inline-block';
    render();
  }
  init();
</script>
</body>
</html>
