<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 · cxkk 技术小站</title>
<style>
  :root{
    --bg:#eef4fb;--card:#fff;--primary:#2f6fed;--primary-soft:#e4edfd;
    --text:#1f2d3d;--text-2:#5a6b7f;--text-3:#8a9ab0;--border:#e3ebf6;
    --radius:12px;--shadow:0 2px 10px rgba(47,111,237,.06);--danger:#e5484d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  a{color:inherit;text-decoration:none}
  header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .nav-inner{max-width:1180px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:28px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;color:var(--primary)}
  .logo-badge{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2f6fed,#5aa0ff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;overflow:hidden}
  .logo-badge img{width:100%;height:100%;object-fit:cover}
  .nav-menu{display:flex;gap:22px;font-size:15px;color:var(--text-2)}
  .nav-menu a:hover{color:var(--primary)}
  .nav-menu a.active{color:var(--primary);font-weight:600}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .nav-link{font-size:14.5px;color:var(--text-2);cursor:pointer;background:#fff;padding:7px 16px;border:1px solid var(--border);border-radius:8px;transition:.15s}
  .nav-link:hover{color:var(--primary);border-color:var(--primary)}
  .nav-btn{background:var(--primary);color:#fff;border:none;padding:7px 16px;border-radius:8px;font-size:14px;cursor:pointer}
  .nav-btn:hover{opacity:.9}

  .wrap{max-width:860px;margin:0 auto;padding:26px 20px 50px}
  .back{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:var(--text-2);margin-bottom:16px;cursor:pointer}
  .back:hover{color:var(--primary)}
  .article-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 36px}
  .article-header{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
  .article-header h1{font-size:26px;font-weight:700;line-height:1.4;margin-bottom:12px}
  .article-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text-3);align-items:center}
  .cat-tag{font-size:12px;color:#fff;background:var(--primary);padding:3px 10px;border-radius:5px}
  .tag{font-size:12px;color:var(--primary);background:var(--primary-soft);padding:3px 10px;border-radius:5px}
  .admin-actions{display:flex;gap:10px;margin-bottom:16px}
  .btn{padding:8px 18px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-weight:600}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{opacity:.9}
  .btn-ghost{background:#eef1f6;color:var(--text-2)}
  .btn-save{background:#16a34a;color:#fff}
  .btn-save:hover{opacity:.9}

  /* 富文本工具栏 */
  .toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border:1px solid var(--border);border-radius:8px 8px 0 0;background:#f7f9fc;margin-bottom:0;position:sticky;top:60px;z-index:50}
  .toolbar button{min-width:32px;height:32px;padding:0 8px;border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer;font-size:14px;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center}
  .toolbar button:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--border)}
  .toolbar button.active{background:var(--primary);color:#fff}
  .toolbar .sep{width:1px;background:var(--border);margin:4px 6px}
  .toolbar select{height:32px;border:1px solid var(--border);border-radius:6px;padding:0 6px;font-size:13px;background:#fff;color:var(--text)}

  /* 正文编辑区 */
  .content{border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;padding:28px 32px;min-height:400px;background:#fff;font-size:15.5px;line-height:1.85;color:var(--text);outline:none}
  .content[contenteditable="true"]{background:#fffef7}
  .content h1{font-size:24px;margin:18px 0 10px;font-weight:700}
  .content h2{font-size:20px;margin:16px 0 8px;font-weight:700}
  .content h3{font-size:17px;margin:14px 0 6px;font-weight:700}
  .content p{margin:10px 0}
  .content ul,.content ol{margin:10px 0 10px 24px}
  .content li{margin:4px 0}
  .content blockquote{border-left:3px solid var(--primary);padding:6px 14px;margin:12px 0;color:var(--text-2);background:var(--primary-soft);border-radius:0 6px 6px 0}
  .content img{max-width:100%;border-radius:8px;margin:12px 0}
  .content a{color:var(--primary);text-decoration:underline}
  .content pre{background:#1e293b;color:#e2e8f0;padding:14px 16px;border-radius:8px;overflow-x:auto;margin:12px 0;font-size:13.5px;line-height:1.6}
  .content code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:13.5px}
  .content pre code{background:none;padding:0}
  .content table{border-collapse:collapse;margin:12px 0;width:100%}
  .content td,.content th{border:1px solid var(--border);padding:8px 12px}
  .content-empty{color:var(--text-3);font-style:italic}

  .save-bar{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
  .hint{font-size:12px;color:var(--text-3);margin-top:8px}

  .login-mask{position:fixed;inset:0;background:rgba(15,30,55,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:#fff;border-radius:14px;width:min(380px,100%);padding:28px 26px}
  .login-box h2{font-size:18px;margin-bottom:6px}
  .login-box .sub{font-size:12.5px;color:var(--text-3);margin-bottom:18px}
  .login-box input{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px 14px;font-size:14px;background:#fbfcfe;margin-bottom:12px}
  .login-box input:focus{outline:none;border-color:var(--primary);background:#fff}
  .login-err{color:var(--danger);font-size:12.5px;margin-bottom:10px;min-height:18px}
  .login-btn{width:100%;border:none;border-radius:8px;padding:11px;font-size:14.5px;background:var(--primary);color:#fff;cursor:pointer;font-weight:600}

  footer{border-top:1px solid var(--border);background:var(--card);padding:26px 20px;text-align:center;color:var(--text-3);font-size:13px;margin-top:30px}
  @media (max-width:900px){.nav-menu{display:none}}
  @media (max-width:560px){.article-card{padding:22px 18px}.content{padding:18px 16px}}
</style>
</head>
<body>
<header>
  <div class="nav-inner">
    <a class="logo" href="/">
      <span class="logo-badge" id="logoBadge">cx</span>
      <span id="siteName">cxkk</span>
    </a>
    <nav class="nav-menu">
      <a href="/">首页</a>
      <a href="/articles.html" class="active">全部文章</a>
      <a href="/apps.html">软件</a>
      <a href="/tutorials.html">教程</a>
      <a href="/about.html">关于</a>
    </nav>
    <div class="nav-right">
      <a class="nav-link" href="/links.html">链接</a>
      <a class="nav-btn" href="javascript:void(0)" onclick="showLogin()">登录</a>
    </div>
  </div>
</header>

<div class="wrap">
  <a class="back" href="javascript:history.back()">‹ 返回</a>
  <div class="article-card">
    <div class="admin-actions" id="adminBar" style="display:none">
      <button class="btn btn-primary" id="btnEdit" onclick="enterEdit()">✎ 编辑正文</button>
      <button class="btn btn-ghost" onclick="location.href='/articles.html'">返回列表</button>
    </div>
    <div class="article-header">
      <h1 id="artTitle">加载中...</h1>
      <div class="article-meta" id="artMeta"></div>
    </div>

    <!-- 工具栏（编辑时显示） -->
    <div class="toolbar" id="toolbar" style="display:none">
      <select id="blockFormat" onchange="exec('formatBlock', this.value)">
        <option value="p">正文</option>
        <option value="h1">标题 1</option>
        <option value="h2">标题 2</option>
        <option value="h3">标题 3</option>
        <option value="blockquote">引用</option>
        <option value="pre">代码块</option>
      </select>
      <span class="sep"></span>
      <button onclick="exec('bold')" title="加粗"><b>B</b></button>
      <button onclick="exec('italic')" title="斜体"><i>I</i></button>
      <button onclick="exec('underline')" title="下划线"><u>U</u></button>
      <button onclick="exec('strikeThrough')" title="删除线"><s>S</s></button>
      <span class="sep"></span>
      <button onclick="exec('insertUnorderedList')" title="无序列表">• 列表</button>
      <button onclick="exec('insertOrderedList')" title="有序列表">1. 列表</button>
      <span class="sep"></span>
      <button onclick="exec('justifyLeft')" title="左对齐">⯇</button>
      <button onclick="exec('justifyCenter')" title="居中">≡</button>
      <button onclick="exec('justifyRight')" title="右对齐">⯈</button>
      <span class="sep"></span>
      <button onclick="insertLink()" title="插入链接">🔗 链接</button>
      <button onclick="insertImage()" title="插入图片">🖼 图片</button>
      <button onclick="exec('removeFormat')" title="清除格式">⌫ 清除</button>
      <span class="sep"></span>
      <button onclick="exec('undo')" title="撤销">↶</button>
      <button onclick="exec('redo')" title="重做">↷</button>
    </div>

    <div class="content" id="content" contenteditable="false"></div>

    <div class="save-bar" id="saveBar" style="display:none">
      <button class="btn btn-ghost" onclick="cancelEdit()">取消</button>
      <button class="btn btn-save" onclick="saveContent()">💾 保存正文</button>
    </div>
    <div class="hint" id="editHint" style="display:none">提示：编辑完成后点击「保存正文」，内容会即时保存到本站。</div>
  </div>
</div>

<footer>
  <p id="footerText">© 2023-2026 By cxkk · 保持热爱，折腾不止</p>
</footer>

<div class="login-mask" id="loginMask" style="display:none">
  <div class="login-box">
    <h2>管理登录</h2>
    <div class="sub">登录后可编辑文章正文</div>
    <input type="password" id="loginPwd" placeholder="请输入管理密码" autocomplete="current-password">
    <div class="login-err" id="loginErr"></div>
    <button class="login-btn" onclick="doLogin()">登 录</button>
  </div>
</div>

<script>
  let ARTICLES = [], ART_IDX = -1, ART = null;
  let AUTHED = false;
  let TOKEN = localStorage.getItem('cxkk_token') || '';
  let origContent = '';

  function applyConfig(cfg){
    if (!cfg) return;
    if (cfg.name) {
      document.getElementById('siteName').textContent = cfg.name;
      document.title = document.title.replace('cxkk', cfg.name);
    }
    if (cfg.footer_text) document.getElementById('footerText').textContent = cfg.footer_text;
    const badge = document.getElementById('logoBadge');
    if (cfg.logo_url) badge.innerHTML = '<img src="' + cfg.logo_url + '" alt="logo">';
    else { badge.innerHTML = ''; badge.textContent = (cfg.logo_text || cfg.name || 'cx').slice(0, 2); }
  }

  function exec(cmd, val){
    document.execCommand(cmd, false, val || null);
    document.getElementById('content').focus();
  }

  function insertLink(){
    const url = prompt('请输入链接地址：', 'https://');
    if (url) exec('createLink', url);
  }

  function insertImage(){
    const url = prompt('请输入图片地址（可先在关于页上传图片获取链接）：', 'https://');
    if (url) exec('insertImage', url);
  }

  function enterEdit(){
    const el = document.getElementById('content');
    origContent = el.innerHTML;
    el.contentEditable = 'true';
    el.focus();
    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('saveBar').style.display = 'flex';
    document.getElementById('editHint').style.display = 'block';
    document.getElementById('btnEdit').style.display = 'none';
    // 光标移到末尾
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function cancelEdit(){
    if (!confirm('放弃本次编辑？')) return;
    document.getElementById('content').innerHTML = origContent;
    exitEdit();
  }

  function exitEdit(){
    const el = document.getElementById('content');
    el.contentEditable = 'false';
    document.getElementById('toolbar').style.display = 'none';
    document.getElementById('saveBar').style.display = 'none';
    document.getElementById('editHint').style.display = 'none';
    document.getElementById('btnEdit').style.display = 'inline-block';
  }

  async function saveContent(){
    const html = document.getElementById('content').innerHTML;
    const next = ARTICLES.slice();
    next[ART_IDX] = Object.assign({}, ART, { content: html });
    try {
      const r = await fetch('/api/articles', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
        body: JSON.stringify(next)
      });
      if (r.status === 401) {
        localStorage.removeItem('cxkk_token'); TOKEN = ''; AUTHED = false;
        showLogin(); document.getElementById('loginErr').textContent = '登录已过期，请重新登录';
        return;
      }
      const d = await r.json();
      if (d.ok) {
        ARTICLES = next;
        ART = next[ART_IDX];
        origContent = html;
        exitEdit();
        alert('正文已保存');
      } else {
        alert('保存失败');
      }
    } catch(e) { alert('保存失败：' + e.message); }
  }

  async function checkAuth(){
    if (!TOKEN) return false;
    try {
      const r = await fetch('/api/check', { headers: { 'Authorization': 'Bearer ' + TOKEN }, cache: 'no-store' });
      const d = await r.json();
      return !!d.ok;
    } catch(e) { return false; }
  }

  function showLogin(){
    const mask = document.getElementById('loginMask');
    mask.style.display = 'flex';
    document.getElementById('loginPwd').focus();
    mask.onclick = e => { if (e.target === mask) mask.style.display = 'none'; };
  }

  async function doLogin(){
    const pwd = document.getElementById('loginPwd').value;
    const err = document.getElementById('loginErr');
    err.textContent = '';
    if (!pwd) { err.textContent = '请输入密码'; return; }
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
      const d = await r.json();
      if (d.ok && d.token) {
        TOKEN = d.token; localStorage.setItem('cxkk_token', TOKEN);
        AUTHED = true;
        document.getElementById('loginMask').style.display = 'none';
        document.getElementById('loginPwd').value = '';
        document.getElementById('adminBar').style.display = 'flex';
      } else { err.textContent = '密码错误'; }
    } catch(e) { err.textContent = '网络错误'; }
  }

  function renderArticle(){
    if (!ART) {
      document.getElementById('artTitle').textContent = '文章不存在';
      document.getElementById('content').innerHTML = '<p class="content-empty">未找到该文章，可能已被删除。</p>';
      return;
    }
    document.getElementById('artTitle').textContent = ART.title;
    document.title = ART.title + ' · ' + (document.getElementById('siteName').textContent || 'cxkk');
    const meta = document.getElementById('artMeta');
    meta.innerHTML = '';
    const cat = document.createElement('span'); cat.className = 'cat-tag'; cat.textContent = ART.cat || '未分类';
    meta.appendChild(cat);
    (ART.tags || []).forEach(t => { const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; meta.appendChild(s); });
    const d = document.createElement('span'); d.textContent = (ART.date || '') + ' 更新';
    const v = document.createElement('span'); v.textContent = (ART.views || '0') + ' 阅读';
    const c = document.createElement('span'); c.textContent = (ART.comments || '0') + ' 评论';
    meta.appendChild(d); meta.appendChild(v); meta.appendChild(c);
    if (ART.url) {
      const link = document.createElement('a');
      link.href = ART.url; link.target = '_blank';
      link.style.cssText = 'font-size:12px;color:#fff;background:var(--primary);padding:3px 10px;border-radius:5px;margin-left:auto';
      link.textContent = '🔗 原文链接';
      meta.appendChild(link);
    }

    const content = document.getElementById('content');
    if (ART.content && ART.content.trim()) {
      content.innerHTML = ART.content;
    } else {
      content.innerHTML = '<p class="content-empty">这篇文章还没有正文内容。' + (AUTHED ? '点击上方「编辑正文」开始写作。' : '登录后可编辑正文。') + '</p>';
    }
  }

  async function init(){
    ART_IDX = parseInt(new URLSearchParams(location.search).get('idx') || '-1', 10);
    try {
      const r = await fetch('/api/site', { cache: 'no-store' });
      const d = await r.json();
      if (d.config) applyConfig(d.config);
      ARTICLES = Array.isArray(d.articles) ? d.articles : [];
    } catch(e) { ARTICLES = []; }
    ART = (ART_IDX >= 0 && ART_IDX < ARTICLES.length) ? ARTICLES[ART_IDX] : null;
    renderArticle();
    AUTHED = await checkAuth();
    if (AUTHED && ART) document.getElementById('adminBar').style.display = 'flex';
  }
  init();
</script>
</body>
</html>
