<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cxkk · 技术小站</title>
<meta name="description" content="cxkk 的个人技术分享站：软件工具、装机教程、系统激活、硬件知识">
<style>
  :root{
    --bg:#eef4fb;
    --card:#ffffff;
    --primary:#2f6fed;
    --primary-soft:#e4edfd;
    --text:#1f2d3d;
    --text-2:#5a6b7f;
    --text-3:#8a9ab0;
    --border:#e3ebf6;
    --radius:12px;
    --shadow:0 2px 10px rgba(47,111,237,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  /* ===== 顶部导航 ===== */
  header{
    position:sticky;top:0;z-index:100;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{
    max-width:1180px;margin:0 auto;padding:0 20px;
    height:60px;display:flex;align-items:center;gap:28px;
  }
  .logo{
    display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;color:var(--primary);
  }
  .logo-badge{
    width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2f6fed,#5aa0ff);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;
  }
  .nav-menu{display:flex;gap:22px;font-size:15px;color:var(--text-2)}
  .nav-menu a:hover{color:var(--primary)}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .nav-btn{
    background:var(--primary);color:#fff;border:none;padding:7px 16px;border-radius:8px;
    font-size:14px;cursor:pointer;
  }
  .nav-btn:hover{opacity:.9}
  .nav-link{
    font-size:14.5px;color:var(--text-2);cursor:pointer;background:#fff;
    padding:7px 16px;border:1px solid var(--border);border-radius:8px;transition:.15s;
  }
  .nav-link:hover{color:var(--primary);border-color:var(--primary)}

  /* ===== 主容器 ===== */
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 40px}
  .columns{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}

  /* ===== 轮播 ===== */
  .carousel{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .carousel-track{display:flex;transition:transform .45s ease}
  .slide{min-width:100%;position:relative;height:250px;background:linear-gradient(120deg,#3b7bf3,#6aa4ff);color:#fff;padding:38px 46px;display:flex;flex-direction:column;justify-content:center}
  .slide:nth-child(2){background:linear-gradient(120deg,#2b5ed0,#4f8bf0)}
  .slide:nth-child(3){background:linear-gradient(120deg,#1d4fae,#3b7bf3)}
  .slide-tag{display:inline-flex;align-items:center;background:rgba(255,255,255,.18);padding:3px 12px;border-radius:999px;font-size:12px;width:max-content;margin-bottom:14px}
  .slide h2{font-size:30px;font-weight:700;margin-bottom:10px}
  .slide p{font-size:15px;opacity:.92;max-width:620px}
  .slide-meta{display:flex;gap:16px;margin-top:22px;font-size:13px;opacity:.9}
  .arrow{
    position:absolute;top:50%;transform:translateY(-50%);z-index:5;
    width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.9);
    color:var(--primary);font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .arrow.prev{left:14px}
  .arrow.next{right:14px}
  .dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:5}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);border:none;cursor:pointer}
  .dot.active{background:#fff;width:22px;border-radius:99px}

  /* ===== 分类标签 ===== */
  .cats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
  .cat{padding:7px 16px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:14px;color:var(--text-2);cursor:pointer;transition:.15s}
  .cat.active,.cat:hover{background:var(--primary);border-color:var(--primary);color:#fff}

  /* ===== 区块标题 ===== */
  .section-title{display:flex;align-items:baseline;gap:12px;margin:26px 0 14px}
  .section-title h3{font-size:20px;font-weight:700}
  .section-title .more{margin-left:auto;font-size:13px;color:var(--primary)}

  /* ===== 文章卡片 ===== */
  .card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .article-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;box-shadow:var(--shadow);transition:.18s;
  }
  .article-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(47,111,237,.12)}
  .article-card h4{font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.4}
  .article-card h4:hover{color:var(--primary)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
  .tag{font-size:12px;color:var(--primary);background:var(--primary-soft);padding:2px 9px;border-radius:5px}
  .meta{display:flex;gap:14px;font-size:12px;color:var(--text-3)}
  .meta span{display:flex;align-items:center;gap:4px}

  /* ===== 排行榜 ===== */
  .sidebar-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
  .sidebar-card h3{font-size:16px;font-weight:700;margin-bottom:14px;position:relative;padding-left:11px}
  .sidebar-card h3::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:4px;border-radius:3px;background:var(--primary)}
  .rank-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border)}
  .rank-item:last-child{border-bottom:none}
  .rank-no{width:22px;height:22px;border-radius:6px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rank-item:nth-child(-n+2) .rank-no{background:var(--primary);color:#fff}
  .rank-title{flex:1;font-size:13.5px;line-height:1.35}
  .rank-title:hover{color:var(--primary)}
  .rank-num{font-size:12px;color:var(--text-3);white-space:nowrap}

  /* ===== 页脚 ===== */
  footer{border-top:1px solid var(--border);background:var(--card);padding:26px 20px;text-align:center;color:var(--text-3);font-size:13px}
  footer .brand{color:var(--text-2);font-weight:600}

  /* ===== 响应式 ===== */
  @media (max-width:900px){
    .columns{grid-template-columns:1fr}
    .nav-menu{display:none}
  }
  @media (max-width:560px){
    .card-grid{grid-template-columns:1fr}
    .slide{height:210px;padding:26px}
    .slide h2{font-size:22px}
  }

  .nav-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-2);line-height:1;padding:4px 2px}
  @media (max-width:900px){
    .nav-toggle{display:block}
    .nav-menu{display:none;position:absolute;top:60px;left:0;right:0;background:#fff;border-bottom:1px solid var(--border);flex-direction:column;padding:8px 20px;box-shadow:0 10px 24px rgba(20,40,80,.12);z-index:99}
    .nav-menu.open{display:flex}
    .nav-menu a{padding:13px 4px;border-bottom:1px dashed var(--border);font-size:15px}
    .nav-menu a:last-child{border-bottom:none}
  }


  .nav-quick{display:flex;align-items:center;gap:2px;margin-right:4px}
  .nav-quick a{font-size:14px;color:var(--text-2);padding:6px 10px;border-radius:8px;text-decoration:none}
  .nav-quick a:hover{color:var(--primary);background:var(--primary-soft)}
  @media (max-width:900px){.nav-quick a{font-size:12.5px;padding:5px 7px}}
</style>
</head>
<body>

<!-- 顶部导航 -->
<header>
  <div class="nav-inner">
    <a class="logo" href="/">
      <span class="logo-badge" id="logoBadge">cx</span>
      <span id="siteName">cxkk</span>
    </a>
    <nav class="nav-menu" id="navMenu"></nav>
    <div class="nav-right">
      <span class="nav-quick" id="navQuick"></span>
      <button class="nav-toggle" id="navToggle" onclick="toggleNav()">☰</button>
<a class="nav-btn" href="/about.html#login">登录</a>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- 轮播 -->
  <div class="carousel" id="carousel">
    <div class="carousel-track" id="carouselTrack"></div>
    <button class="arrow prev" onclick="moveSlide(-1)">‹</button>
    <button class="arrow next" onclick="moveSlide(1)">›</button>
    <div class="dots" id="dots"></div>
  </div>

  <!-- 分类标签 -->
  <div class="cats">
    <button class="cat active" data-href="">智能推荐</button>
    <button class="cat" data-href="/articles.html">全部文章</button>
    <button class="cat" data-href="/articles.html?cat=PE%E5%88%B6%E4%BD%9C">PE 制作</button>
    <button class="cat" data-href="/apps.html">软件</button>
    <button class="cat" data-href="/tutorials.html">教程</button>
    <button class="cat" data-href="/articles.html?cat=%E7%A1%AC%E4%BB%B6">硬件</button>
  </div>

  <div class="columns">

    <!-- 左：文章列表 -->
    <div>
      <div class="section-title">
        <h3>近期文章</h3>
        <a class="more" href="/articles.html">更多 ›</a>
      </div>
      <div class="card-grid" id="recentList"></div>

      <!-- 软件区块 -->
      <div class="section-title">
        <h3>软件</h3>
        <a class="more" href="/apps.html">更多 ›</a>
      </div>
      <div class="card-grid" id="appList"></div>

      <!-- 教程区块 -->
      <div class="section-title">
        <h3>教程</h3>
        <a class="more" href="/tutorials.html">更多 ›</a>
      </div>
      <div class="card-grid" id="tutList"></div>

    </div>

    <!-- 右：排行榜 -->
    <aside>
      <div class="sidebar-card">
        <h3>热评文章</h3>
        <div id="hotList"></div>
      </div>
      <div class="sidebar-card">
        <h3>阅读最多</h3>
        <div id="topList"></div>
      </div>
    </aside>

  </div>
</div>

<footer>
  <p id="footerText"><span class="brand">© 2023-2026 By cxkk</span> &nbsp;·&nbsp; 保持热爱，折腾不止</p>
  <p style="margin-top:6px">本站为个人技术分享站 · <a href="/about.html" style="color:var(--primary)">关于本站</a></p>
</footer>

<script>
  /* 站点配置与数据 */
  let CFG = {};
  let ARTS = [];

  function openArticle(a, idx){
    if (a && a.url) { window.open(a.url, '_blank'); }
    else { window.open('/article.html?idx=' + idx, '_self'); }
  }

  function cardHtml(a, idx){
    const el = document.createElement('article');
    el.className = 'article-card';
    el.style.cursor = 'pointer';
    el.onclick = () => openArticle(a, idx);
    const h = document.createElement('h4'); h.textContent = a.title;
    el.appendChild(h);
    const tags = document.createElement('div'); tags.className = 'tags';
    (a.tags || []).slice(0, 3).forEach(t => {
      const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; tags.appendChild(s);
    });
    el.appendChild(tags);
    const meta = document.createElement('div'); meta.className = 'meta';
    const d = document.createElement('span'); d.textContent = (a.date || '') + ' 更新';
    const c = document.createElement('span'); c.textContent = (a.comments || '0') + ' 评论';
    const v = document.createElement('span'); v.textContent = (a.views || '0') + ' 阅读';
    meta.appendChild(d); meta.appendChild(c); meta.appendChild(v);
    el.appendChild(meta);
    return el;
  }

  function renderHome(){
    if (!ARTS.length) return;
    const recent = document.getElementById('recentList');
    ARTS.slice(0, 6).forEach(a => recent.appendChild(cardHtml(a, ARTS.indexOf(a))));
    const apps = document.getElementById('appList');
    ARTS.filter(a => a.cat === '软件').slice(0, 2).forEach(a => apps.appendChild(cardHtml(a, ARTS.indexOf(a))));
    const tuts = document.getElementById('tutList');
    ARTS.filter(a => a.cat === '教程').slice(0, 4).forEach(a => tuts.appendChild(cardHtml(a, ARTS.indexOf(a))));

    const num = s => parseInt(String(s || '0').replace(/[^\d]/g, ''), 10) || 0;
    const hot = [...ARTS].sort((a, b) => num(b.comments) - num(a.comments)).slice(0, 4);
    const top = [...ARTS].sort((a, b) => num(b.views) - num(a.views)).slice(0, 4);
    const hotBox = document.getElementById('hotList');
    hot.forEach((a, i) => {
      const row = document.createElement('div'); row.className = 'rank-item'; row.style.cursor = 'pointer';
      row.onclick = () => openArticle(a, ARTS.indexOf(a));
      const no = document.createElement('span'); no.className = 'rank-no'; no.textContent = i + 1;
      const t = document.createElement('span'); t.className = 'rank-title'; t.textContent = a.title;
      const n = document.createElement('span'); n.className = 'rank-num'; n.textContent = (a.comments || '0') + ' 评';
      row.appendChild(no); row.appendChild(t); row.appendChild(n);
      hotBox.appendChild(row);
    });
    const topBox = document.getElementById('topList');
    top.forEach((a, i) => {
      const row = document.createElement('div'); row.className = 'rank-item'; row.style.cursor = 'pointer';
      row.onclick = () => openArticle(a, ARTS.indexOf(a));
      const no = document.createElement('span'); no.className = 'rank-no'; no.textContent = i + 1;
      const t = document.createElement('span'); t.className = 'rank-title'; t.textContent = a.title;
      const n = document.createElement('span'); n.className = 'rank-num'; n.textContent = String(a.views || '0');
      row.appendChild(no); row.appendChild(t); row.appendChild(n);
      topBox.appendChild(row);
    });
  }

  function applyCfg(cfg){
    if (!cfg) return;
    CFG = cfg;
    if (cfg.name) {
      document.getElementById('siteName').textContent = cfg.name;
      document.title = document.title.replace('cxkk', cfg.name);
    }
    if (cfg.footer_text) document.getElementById('footerText').innerHTML = cfg.footer_text.replace(/</g, '&lt;');
    const badge = document.getElementById('logoBadge');
    if (cfg.logo_url) {
      badge.innerHTML = '<img src="' + cfg.logo_url + '" alt="logo" style="width:100%;height:100%;object-fit:cover">';
    } else {
      badge.innerHTML = '';
      badge.textContent = (cfg.logo_text || cfg.name || 'cx').slice(0, 2);
    renderNav(cfg);
    }
  }

  async function init(){
    try {
      const r = await fetch('/api/site', { cache: 'no-store' });
      const d = await r.json();
      if (d.config) { applyCfg(d.config); renderCarousel(d.config.carousel); }
      ARTS = Array.isArray(d.articles) ? d.articles : [];
      renderHome();
    } catch(e) {}
  }

  /* 轮播逻辑 */
  let cur = 0;
  let slides = 0;
  let dots = [];
  const track = document.getElementById('carouselTrack');
  const dotsBox = document.getElementById('dots');

  function renderCarousel(list){
    track.innerHTML = '';
    dotsBox.innerHTML = '';
    const data = (list && list.length) ? list : [
      { img:'', title:'显卡驱动升级助手', desc:'一键检测并升级 NVIDIA / AMD 显卡驱动', url:'' },
      { img:'', title:'PE 系统制作系统 U 盘', desc:'三步制作可启动 PE 维护 U 盘', url:'' },
      { img:'', title:'一键重装系统', desc:'自动下载镜像、备份驱动、无人值守重装', url:'' }
    ];
    data.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'slide';
      if (s.img) el.style.backgroundImage = 'url(' + s.img + ')';
      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';
      const tag = document.createElement('span'); tag.className = 'slide-tag'; tag.textContent = '置顶推荐';
      const h = document.createElement('h2'); h.textContent = s.title || '';
      const p = document.createElement('p'); p.textContent = s.desc || '';
      el.appendChild(tag); el.appendChild(h); el.appendChild(p);
      if (s.url) {
        el.style.cursor = 'pointer';
        el.onclick = () => window.open(s.url, '_blank');
      }
      track.appendChild(el);
      const d = document.createElement('button');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.onclick = () => go(i);
      dotsBox.appendChild(d);
    });
    slides = data.length;
    dots = dotsBox.children;
    cur = 0;
    track.style.transform = 'translateX(0)';
  }

  function go(i){
    if (!slides) return;
    cur = (i + slides) % slides;
    track.style.transform = 'translateX(-' + (cur * 100) + '%)';
    for (let k = 0; k < dots.length; k++) dots[k].className = 'dot' + (k === cur ? ' active' : '');
  }
  function moveSlide(step){ go(cur + step); }
  setInterval(() => go(cur + 1), 5000);

  /* 分类标签跳转 */
  document.querySelectorAll('.cat').forEach(btn => {
    btn.addEventListener('click', () => {
      const href = btn.dataset.href;
      if (href) { location.href = href; return; }
      document.querySelectorAll('.cat').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  init();

  const DEFAULT_NAV = [
    { label: '首页', url: '/' },
    { label: '全部文章', url: '/articles.html' },
    { label: '软件', url: '/apps.html' },
    { label: '教程', url: '/tutorials.html' },
    { label: '关于', url: '/about.html' },
    { label: '网盘', url: '/drive.html' },
    { label: '链接', url: '/links.html' }
  ];

  function renderNav(cfg){
    const menu = document.getElementById('navMenu');
    if (!menu) return;
    const quick = document.getElementById('navQuick');
    const nav = (cfg.nav && cfg.nav.length) ? cfg.nav : DEFAULT_NAV;
    const cur = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
    const isQuick = n => /drive\.html/.test(n.url || '') || /links\.html/.test(n.url || '');
    if (quick) {
      quick.innerHTML = nav.filter(isQuick).map(n => {
        const href = n.url || '/';
        const ext = n.external ? ' target="_blank" rel="noopener"' : '';
        return '<a href="' + href.replace(/"/g, '&quot;') + '"' + ext + '>' +
               String(n.label || '').replace(/</g, '&lt;') + '</a>';
      }).join('');
    }
    const rest = nav.filter(n => !isQuick(n));
    menu.innerHTML = rest.map(n => {
      const href = n.url || '/';
      const target = (href === '/' ? '' : (href.split('?')[0].split('/').pop().replace(/\.html$/, '') || 'index'));
      const active = (target === cur) ? ' class="active"' : '';
      const ext = n.external ? ' target="_blank" rel="noopener"' : '';
      return '<a href="' + href.replace(/"/g, '&quot;') + '"' + active + ext + '>' +
             String(n.label || '').replace(/</g, '&lt;') + '</a>';
    }).join('');
  }


  function toggleNav(){
    const m = document.getElementById('navMenu');
    if (m) m.classList.toggle('open');
  }
  document.addEventListener('click', e => {
    const m = document.getElementById('navMenu');
    const t = document.getElementById('navToggle');
    if (m && t && !m.contains(e.target) && !t.contains(e.target)) m.classList.remove('open');
  });

</script>
</body>
</html>
